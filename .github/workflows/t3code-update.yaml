name: Update T3 Code
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
concurrency:
  group: update-${{ github.ref }}
jobs:
  update:
    name: Find new releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      message: ${{ steps.update.outputs.commit_message }}
      sources: ${{ steps.sources.outputs.sources }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update sources
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/update.sh
      - name: Export sources
        id: sources
        if: steps.update.outputs.commit_message != ''
        run: echo "sources=$(jq -c . sources.json)" >>"$GITHUB_OUTPUT"
  check:
    name: Check update
    needs: update
    if: needs.update.outputs.message != ''
    uses: ./.github/workflows/check.yaml
    with:
      sources: ${{ needs.update.outputs.sources }}
  # The only job with write access. It never builds or runs T3 Code.
  publish:
    name: Publish update
    needs: [update, check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Commit and push
        env:
          MESSAGE: ${{ needs.update.outputs.message }}
          SOURCES: ${{ needs.update.outputs.sources }}
        run: |
          jq . <<<"$SOURCES" >sources.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$MESSAGE" -- sources.json
          git push origin "HEAD:$GITHUB_REF_NAME"
